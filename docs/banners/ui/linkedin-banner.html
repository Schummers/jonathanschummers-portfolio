<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LinkedIn banner — Jonathan Schummers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  /* CV brand canon — voir docs/cv/DESIGN-CV.md */
  :root {
    --text-primary: #18181b;
    --text-secondary: #66666f; /* fork CV : assombri pour le print */
    --text-tertiary: #9f9fa7;
    --accent-cv: #c2410c; /* terracotta CV (labels de section) */
    --card-estate-bg: #f7f2f0; /* fond warm carte Real Estate du CV */
    --surface: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: var(--card-estate-bg);
    font-family: "Manrope", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Faint grid texture so the empty space doesn't read as a blank slab */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.4;
    mask-image: radial-gradient(120% 90% at 78% 50%, #000 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(120% 90% at 78% 50%, #000 30%, transparent 78%);
  }

  /* ---- Left: screenshot collage (decorative, Trevor-style) ---- */
  .collage {
    position: absolute;
    left: 0;
    top: 0;
    width: 660px;
    height: 396px;
  }

  .frame {
    position: absolute;
    border: 1px solid rgba(212, 212, 216, 0.7);
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 18px 40px -12px rgba(24, 24, 27, 0.28);
  }

  .frame .chrome {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 16px;
    padding: 0 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .frame .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot.r { background: #ef4444; }
  .dot.y { background: #f59e0b; }
  .dot.g { background: #22c55e; }

  .frame img {
    display: block;
    width: 100%;
    height: 168px;
    object-fit: cover;
    object-position: top center;
  }

  .f1 { left: -28px;  top: 36px;  width: 338px; transform: rotate(-5deg); z-index: 1; }
  .f2 { left: 286px;  top: 22px;  width: 318px; transform: rotate(4deg);  z-index: 3; }
  .f3 { left: 96px;   top: 196px; width: 300px; transform: rotate(-2deg); z-index: 2; }

  /* ---- Right: headline block ---- */
  .text {
    position: absolute;
    right: 64px;
    top: 50%;
    transform: translateY(-50%);
    width: 800px;
    text-align: left;
  }

  .accent-rule {
    width: 56px;
    height: 4px;
    background: var(--accent-cv);
    border-radius: 2px;
    margin-bottom: 22px;
  }

  .headline {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 56px;
    line-height: 1.06;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .headline .sub {
    display: block;
    margin-top: 8px;
    font-weight: 500;
    font-size: 38px;
    letter-spacing: -0.01em;
    color: var(--text-secondary);
  }

  /* ---- Top-right: portfolio URL ---- */
  .url {
    position: absolute;
    right: 64px;
    top: 30px;
    font-family: "Manrope", sans-serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.01em;
    color: var(--text-tertiary);
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="collage">
    <div class="frame f1">
      <div class="chrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <img src="/public/images/Experiences/Smartintegrity/Principal.webp" alt="" />
    </div>
    <div class="frame f3">
      <div class="chrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <img src="/public/images/Experiences/Smartintegrity/tableviee 2.webp" alt="" />
    </div>
    <div class="frame f2">
      <div class="chrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <img src="/public/images/Experiences/Boosted/Principal.webp" alt="" />
    </div>
  </div>

  <div class="url">jonathanschummers.com</div>

  <div class="text">
    <div class="accent-rule"></div>
    <div class="headline">
      Data-driven Product Designer
      <span class="sub">with Product Management skills</span>
    </div>
  </div>
</body>
</html>
