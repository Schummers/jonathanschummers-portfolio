<!DOCTYPE html>

<head>

<style>
  /* V3 — filmstrip : 4 tuiles en une rangée alignée */

  .text { right: 56px; width: 640px; }
  .headline { font-size: 48px; }

</style>
</head>

  <div class="collage">
    <div class="frame"><div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="shot"><img src="/public/images/Experiences/Smartintegrity/Principal.webp" alt="" /></div></div>
