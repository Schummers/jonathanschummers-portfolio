<!DOCTYPE html>
<html lang="fr" class="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test couleurs — labels MAJ homepage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  /* =========================================================
     TOKENS — copiés de app/globals.css (light + dark réels)
     ========================================================= */
  :root {
    --bg: #fafafa;
    --surface: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text-primary: #18181b;
    --text-secondary: #71717b;
    --text-tertiary: #9f9fa9;
    --btn: #1e1e21;
    --btn-fg: #fafafa;

    --space-xs: 8px;
    --space-sm: 16px;
    --space-md: 24px;
    --space-lg: 32px;
    --space-xl: 48px;
    --space-2xl: 64px;
  }
  html.dark {
    --bg: #09090b;
    --surface: #18181b;
    --border: #27272a;
    --border-strong: #3f3f47;
    --text-primary: #e4e4e7;
    --text-secondary: #9f9fa9;
    --text-tertiary: #71717b;
    --btn: #ececee;
    --btn-fg: #09090b;
  }

  /* --acc est posé en inline par render() selon le thème (light/dark) */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Manrope", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }

  /* ---- Barre de contrôle fixe ---- */
  .controls {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-md);
    padding: 12px 24px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .controls .title {
    font-family: "Manrope"; font-size: 13px; font-weight: 500;
    letter-spacing: .04em; color: var(--text-secondary);
  }
  .toggle {
    font-family: "Manrope"; font-size: 13px; font-weight: 500;
    padding: 8px 16px; border-radius: 1px; cursor: pointer;
    background: var(--btn); color: var(--btn-fg); border: none;
  }

  .page { max-width: 1120px; margin: 0 auto; padding: 56px 0 120px; }

  /* ======================= TABLEAU COMPARATIF ======================= */
  .board { padding-top: var(--space-lg); }
  .board > h2 {
    font-family: "Space Grotesk"; font-weight: 700; font-size: 24px;
    letter-spacing: -.02em; color: var(--text-primary);
  }
  .board > p {
    font-size: 14px; color: var(--text-secondary); margin-top: 6px;
    margin-bottom: var(--space-lg);
  }
  .group-label {
    font-family: "Manrope"; font-weight: 700; font-size: 12px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--text-tertiary);
    margin: var(--space-lg) 0 var(--space-sm);
  }
  .board-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 1px;
    background: var(--border); border: 1px solid var(--border);
  }
  .cell {
    background: var(--bg); padding: var(--space-md);
    display: flex; flex-direction: column; gap: 10px;
  }
  .cell .top { display: flex; align-items: center; gap: 10px; }
  .cell .sw { width: 16px; height: 16px; border-radius: 3px; background: var(--acc); outline: 1px solid var(--border-strong); }
  .cell .nm { font-family: "Space Grotesk"; font-weight: 700; font-size: 15px; color: var(--text-primary); }
  .cell .brand { font-size: 11px; color: var(--text-tertiary); margin-left: auto; text-align: right; }
  .cell .sample {
    font-family: "Manrope"; font-weight: 700; font-size: 14px; line-height: 20px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--acc);
  }
  .cell .sample.head {
    font-family: "Space Grotesk"; font-size: 17px; letter-spacing: -.01em;
    text-transform: none; color: var(--text-primary);
  }
  .cell .meta {
    display: flex; align-items: center; gap: 10px; margin-top: 2px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    color: var(--text-tertiary);
  }
  .badge {
    font-family: "Manrope"; font-weight: 500; font-size: 11px;
    padding: 2px 7px; border-radius: 8px; border: 1px solid var(--border);
  }
  .badge.pass { color: #15803d; border-color: color-mix(in srgb, #15803d 35%, transparent); }
  .badge.warn { color: #b45309; border-color: color-mix(in srgb, #b45309 35%, transparent); }
  html.dark .badge.pass { color: #4ade80; }
  html.dark .badge.warn { color: #fbbf24; }

  /* ---- Bandeau d'étiquette de variante ---- */
  .variant-tag {
    display: flex; align-items: baseline; gap: 12px;
    padding: 20px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-top: var(--space-2xl);
  }
  .variant-tag .name {
    font-family: "Space Grotesk"; font-weight: 700; font-size: 20px;
    letter-spacing: -.02em; color: var(--text-primary);
  }
  .variant-tag .swatch {
    width: 14px; height: 14px; border-radius: 3px; background: var(--acc);
    align-self: center; outline: 1px solid var(--border-strong);
  }
  .variant-tag .hex {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    color: var(--text-tertiary); margin-left: auto;
  }

  /* ---- Cadre "site" : bordures latérales comme BlueprintShell ---- */
  .shell { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

  /* ---- Nav ---- */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px var(--space-xl); border-bottom: 1px solid var(--border);
  }
  .nav .brand { font-family: "Space Grotesk"; font-weight: 700; font-size: 16px; color: var(--text-primary); letter-spacing: -.01em; }
  .nav .links { display: flex; gap: var(--space-lg); }
  .nav .links a { font-size: 14px; color: var(--text-secondary); text-decoration: none; }

  /* ---- Hero ---- */
  .hero { padding: var(--space-xl); border-bottom: 1px solid var(--border); }
  .hero .eyebrow { font-family: "Space Grotesk"; font-weight: 700; font-size: 22px; color: var(--text-secondary); letter-spacing: -.01em; }
  .hero h1 { font-family: "Space Grotesk"; font-weight: 700; font-size: 44px; line-height: 1.05; letter-spacing: -.02em; margin-top: 12px; color: var(--text-primary); max-width: 760px; }
  .hero .sub { font-family: "Space Grotesk"; font-weight: 700; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; margin-top: var(--space-lg); color: var(--text-primary); max-width: 720px; }

  /* ---- LABEL MAJ (l'objet du test) ---- */
  .label {
    font-family: "Manrope"; font-weight: 700; font-size: 14px;
    line-height: 20px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--acc);   /* <<< couleur testée */
  }

  /* ---- Carte projet featured ---- */
  .card-featured { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
  .card-featured .text { display: flex; flex-direction: column; gap: var(--space-md); padding: 56px var(--space-xl); }
  .card-featured h2 { font-family: "Space Grotesk"; font-weight: 700; font-size: 30px; line-height: 1.12; letter-spacing: -.02em; color: var(--text-primary); margin-top: 6px; }
  .thumb { background: var(--surface); border-left: 1px solid var(--border); display: flex; align-items: center; justify-content: center; min-height: 260px; }
  .thumb .frame { width: 78%; aspect-ratio: 16/10; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.06); display: flex; flex-direction: column; overflow: hidden; }
  .thumb .frame .bar { height: 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 5px; padding: 0 8px; }
  .thumb .frame .bar i { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); display: inline-block; }
  .thumb .frame .body { flex: 1; background: var(--surface); }

  /* ---- Tags ---- */
  .tags { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
  .tag { font-family: "Manrope"; font-size: 12px; font-weight: 500; line-height: 16px; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }

  /* ---- Carte projet compact ---- */
  .card-compact { display: flex; align-items: center; justify-content: space-between; gap: var(--space-xl); padding: var(--space-md) var(--space-xl); border-bottom: 1px solid var(--border); }
  .card-compact .text { display: flex; flex-direction: column; gap: var(--space-sm); }
  .card-compact h3 { font-family: "Space Grotesk"; font-weight: 700; font-size: 22px; line-height: 1.18; letter-spacing: -.01em; color: var(--text-primary); margin-top: 4px; max-width: 620px; }
  .card-compact .mini { width: 230px; flex: none; aspect-ratio: 16/9; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; }

  /* ---- About ---- */
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xl); padding: 56px var(--space-xl); border-bottom: 1px solid var(--border); }
  .about p.body { font-size: 16px; line-height: 26px; color: var(--text-secondary); margin-top: var(--space-sm); max-width: 460px; }

  /* ---- CTA / liens ---- */
  .cta { padding: 56px var(--space-xl); }
  .cta h2 { font-family: "Space Grotesk"; font-weight: 700; font-size: 30px; letter-spacing: -.02em; color: var(--text-primary); margin-top: 6px; }
  .cta .row { display: flex; align-items: center; gap: var(--space-md); margin-top: var(--space-md); }
  .btn-primary { font-family: "Manrope"; font-size: 16px; font-weight: 500; padding: 12px 24px; border-radius: 1px; background: var(--btn); color: var(--btn-fg); border: none; text-decoration: none; }
  .cta .links { display: flex; gap: var(--space-md); }
  .cta .links a { font-size: 14px; color: var(--acc); text-decoration: none; font-weight: 500; }

  @media (max-width: 900px) {
    .card-featured, .about { grid-template-columns: 1fr; }
    .thumb { border-left: none; border-top: 1px solid var(--border); }
    .card-compact .mini { display: none; }
  }
</style>
</head>
<body>
  <div class="controls">
    <span class="title">Test couleurs · labels MAJ homepage</span>
    <button class="toggle" id="toggle">Passer en dark</button>
  </div>

  <div class="page" style="padding-left:24px;padding-right:24px;">
    <div class="board" id="board"></div>
  </div>

  <div id="page"></div>

<script>
  // ---- Candidats : existants + dérivés de DS connus ----
  const CANDIDATES = [
    // -- Existants (point de départ) --
    { group: "Existants", name: "Accent actuel", brand: "DS actuel (bleu électrique)", light: "#0A4CF0", dark: "#6d9dfa" },
    { group: "Existants", name: "Cyan",          brand: "exploration",                light: "#1C87A0", dark: "#209AB6" },
    { group: "Existants", name: "Azure",         brand: "exploration",                light: "#0E86AF", dark: "#1098C6" },
    { group: "Existants", name: "Grey-blue",     brand: "exploration",                light: "#546ECD", dark: "#748AD7" },
    // -- Famille froide analogue (risque faible, cohérent avec le zinc) --
    { group: "Famille froide (sûr)", name: "Royal blue", brand: "GitHub Primer / Atlassian", light: "#0969DA", dark: "#58A6FF" },
    { group: "Famille froide (sûr)", name: "Indigo",     brand: "Stripe / Linear",           light: "#4F46E5", dark: "#818CF8" },
    { group: "Famille froide (sûr)", name: "Violet",     brand: "Material 3 / Slack",        light: "#7C3AED", dark: "#A78BFA" },
    { group: "Famille froide (sûr)", name: "Teal",       brand: "IBM Carbon / Supabase",     light: "#0F766E", dark: "#2DD4BF" },
    { group: "Famille froide (sûr)", name: "Emerald",    brand: "Supabase",                  light: "#047857", dark: "#34D399" },
    // -- Contraste chaud (audacieux, éditorial) --
    { group: "Contraste chaud (audacieux)", name: "Clay / terracotta", brand: "Anthropic", light: "#C2410C", dark: "#FB923C" },
  ];

  // ---- Données projets réelles (lib/data.ts) ----
  const featured = {
    company: "TotalEnergies / Digital Factory",
    title: "Revamping a power plant monitoring SaaS to increase kWh tracked per operator by 23%",
    tags: ["16 months", "350+ assets", "Usability testing in prod", "Real-time plant data"],
  };
  const compact = [
    { company: "Spie Batignolles", title: "A construction app connecting site crews to a complex ERP, replacing 3 legacy tools", tags: ["11 months", ">1000 users", "Alignment workshops"] },
    { company: "TotalEnergies / Digital Factory", title: "Reduced refinery pipe leaks by 6% with a corrosion risk tool for 500 inspectors", tags: ["18 months", "500 users · 4 sites", "User testing"] },
    { company: "Malaama", title: "Website for an NGO empowering girls' education in Mauritania", tags: ["Product Builder", "Web Design", "Social Impact"] },
  ];

  // ---- Contraste WCAG ----
  const lum = (hex) => {
    const c = hex.replace('#','');
    const v = [0,2,4].map(i => parseInt(c.substr(i,2),16)/255)
      .map(x => x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4));
    return 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
  };
  const ratio = (a, b) => { const l1=lum(a), l2=lum(b); const hi=Math.max(l1,l2), lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05); };

  const tags = (arr) => `<div class="tags">${arr.map(t => `<span class="tag">${t}</span>`).join("")}</div>`;
  const frame = () => `<div class="frame"><div class="bar"><i></i><i></i><i></i></div><div class="body"></div></div>`;

  function homepage() {
    return `
    <div class="shell">
      <div class="nav">
        <span class="brand">Jonathan Schummers</span>
        <span class="links"><a href="#">Work</a><a href="#">About</a><a href="#">Contact</a></span>
      </div>
      <div class="hero">
        <p class="eyebrow">Hi, I'm Jonathan.</p>
        <h1>Freelance product designer (6y+).</h1>
        <p class="sub">I research, strategize, and design for proptech &amp; fintech SaaS.</p>
      </div>
      <div class="card-featured">
        <div class="text">
          <div><p class="label">${featured.company}</p><h2>${featured.title}</h2></div>
          ${tags(featured.tags)}
        </div>
        <div class="thumb">${frame()}</div>
      </div>
      ${compact.map(p => `
      <div class="card-compact">
        <div class="text">
          <div><p class="label">${p.company}</p><h3>${p.title}</h3></div>
          ${tags(p.tags)}
        </div>
        <div class="mini"></div>
      </div>`).join("")}
      <div class="about">
        <div><p class="label">About</p><p class="body">Product designer based in Luxembourg, working remotely with proptech and fintech teams across Europe.</p></div>
        <div><p class="label">Currently</p><p class="body">Available for freelance product design missions starting Q3 2026.</p></div>
      </div>
      <div class="cta">
        <p class="label">Get in touch</p>
        <h2>Let's build something that works.</h2>
        <div class="row">
          <a href="#" class="btn-primary">Get in touch</a>
          <span class="links"><a href="#">LinkedIn</a><a href="#">Malt</a><a href="#">GitHub</a></span>
        </div>
      </div>
    </div>`;
  }

  function render() {
    const isDark = document.documentElement.classList.contains("dark");
    const bg = isDark ? "#09090b" : "#fafafa";
    const val = (c) => isDark ? c.dark : c.light;

    // ---- Tableau comparatif (groupé) ----
    const groups = [...new Set(CANDIDATES.map(c => c.group))];
    document.getElementById("board").innerHTML = `
      <h2>Tableau comparatif — labels MAJ</h2>
      <p>${CANDIDATES.length} couleurs · contraste calculé sur le fond ${isDark ? "dark (#09090b)" : "light (#fafafa)"}. AA texte ≥ 4.5:1.</p>
      ${groups.map(g => `
        <div class="group-label">${g}</div>
        <div class="board-grid">
          ${CANDIDATES.filter(c => c.group === g).map(c => {
            const r = ratio(val(c), bg);
            const ok = r >= 4.5;
            return `<div class="cell" style="--acc:${val(c)}">
              <div class="top"><span class="sw"></span><span class="nm">${c.name}</span><span class="brand">${c.brand}</span></div>
              <div class="sample">TotalEnergies / Digital Factory</div>
              <div class="sample head">Revamping a power plant monitoring SaaS</div>
              <div class="meta"><span>${val(c)}</span><span class="badge ${ok?'pass':'warn'}">${r.toFixed(1)}:1 ${ok?'AA':'⚠︎'}</span></div>
            </div>`;
          }).join("")}
        </div>`).join("")}
    `;

    // ---- Homepages en contexte (toutes) ----
    document.getElementById("page").innerHTML = CANDIDATES.map(c => `
      <div class="page" style="padding-top:0;padding-bottom:0;">
        <div class="variant" style="--acc:${val(c)}">
          <div class="variant-tag">
            <span class="swatch"></span>
            <span class="name">${c.name}</span>
            <span class="hex">${val(c)} · ${isDark ? "dark" : "light"} · ${c.brand}</span>
          </div>
          ${homepage()}
        </div>
      </div>
    `).join("");
  }

  document.getElementById("toggle").addEventListener("click", () => {
    const el = document.documentElement;
    const dark = el.classList.toggle("dark");
    el.classList.toggle("light", !dark);
    document.getElementById("toggle").textContent = dark ? "Passer en light" : "Passer en dark";
    render();
  });

  render();
</script>
</body>
</html>
